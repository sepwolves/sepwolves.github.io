menu:
  # Home: / || fas fa-home
  # List||fas fa-list:
  #   Music: /music/ || fas fa-music
  #   Movie: /movies/ || fas fa-video
  小说集合: /novel-collection.html || fas fa-book

# 自定义头像和网站图标（狼头）
avatar:
  img: /img/avatar-wolf.svg
  effect: false

favicon: /img/avatar-wolf.svg

# 禁止封面大图，直接显示博客内容
cover:
  index_enable: false
  aside_enable: false
  archives_enable: false
  default_cover:

# 禁止顶部横幅图片
disable_top_img: true

# 侧边栏作者卡片 - Follow Me 按钮指向自己的 GitHub
aside:
  card_author:
    enable: true
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/sepwolves
  card_post_series:
    enable: true
    series_title: true

# 系列文章支持（用于小说章节侧边栏目录）
series:
  enable: true
  orderBy: 'title'
  order: 1


# 自定义样式：小说分类页的网格布局（见 source/css/novel-grid.css）
inject:
  head:
    - <link rel="stylesheet" href="/css/novel-grid.css">

# 评论系统
comments:
  use: Waline
  text: true
  lazyload: false
  count: true
  card_post_count: false

# 统计配置（关闭不蒜子页面阅读量，使用 Waline 阅读量统计）
busuanzi:
  page_pv: false

# Waline 评论与互动配置
waline:
  serverURL: 'https://140.245.65.111.sslip.io'
  pageview: true
  option:
    reaction: true
    emoji:
      - https://unpkg.com/@waline/emojis@1.2.0/bilibili
      - https://unpkg.com/@waline/emojis@1.2.0/weibo
      - https://unpkg.com/@waline/emojis@1.2.0/qq
    requiredMeta:
      - nick


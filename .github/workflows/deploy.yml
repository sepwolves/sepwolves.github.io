name: Deploy Hexo

on:
  push:
    branches:
      - master # 监听博客主库的变动
  workflow_dispatch: # 允许在 Actions 页面手动点击按钮触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取博客主库与小说内容
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. 安装依赖
        run: npm install && npm install hexo-generator-searchdb

      - name: 4. 执行 Hexo 静态生成
        run: npx hexo generate

      - name: 5. 上传产物并发布
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
